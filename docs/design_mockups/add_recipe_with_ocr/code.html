<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Recipe - ClayCook</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "error": "#ba1a1a",
                    "on-surface-variant": "#3f4a3d",
                    "secondary-fixed-dim": "#e3c0a0",
                    "surface-container": "#efeded",
                    "on-background": "#1b1c1c",
                    "outline": "#6f7a6c",
                    "secondary": "#74593f",
                    "on-primary-fixed-variant": "#005316",
                    "on-secondary-fixed-variant": "#5a422a",
                    "background": "#fbf9f8",
                    "on-secondary-fixed": "#2a1704",
                    "inverse-primary": "#77dc7a",
                    "on-error": "#ffffff",
                    "tertiary-container": "#eceabe",
                    "on-tertiary-fixed-variant": "#484828",
                    "tertiary-fixed": "#e6e5b9",
                    "primary-container": "#98ff98",
                    "surface-bright": "#fbf9f8",
                    "surface-variant": "#e4e2e2",
                    "outline-variant": "#becab9",
                    "on-primary-container": "#007924",
                    "on-primary": "#ffffff",
                    "secondary-container": "#fed9b8",
                    "surface": "#fbf9f8",
                    "surface-dim": "#dbd9d9",
                    "on-secondary-container": "#795d43",
                    "on-tertiary-container": "#6a6946",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary-fixed": "#1d1d03",
                    "surface-container-low": "#f5f3f3",
                    "surface-container-highest": "#e4e2e2",
                    "primary-fixed": "#93f993",
                    "on-primary-fixed": "#002105",
                    "inverse-on-surface": "#f2f0f0",
                    "tertiary": "#60603e",
                    "primary-fixed-dim": "#77dc7a",
                    "surface-tint": "#006e20",
                    "tertiary-fixed-dim": "#cac99f",
                    "on-secondary": "#ffffff",
                    "on-tertiary": "#ffffff",
                    "primary": "#006e20",
                    "error-container": "#ffdad6",
                    "on-error-container": "#93000a",
                    "inverse-surface": "#303030",
                    "on-surface": "#1b1c1c",
                    "surface-container-high": "#eae8e7",
                    "secondary-fixed": "#ffdcbe"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "spacing": {
                    "touch-target": "48px",
                    "container-padding": "20px",
                    "card-gutter": "12px",
                    "base": "8px",
                    "stack-gap": "16px"
            },
            "fontFamily": {
                    "headline-lg": [
                            "Quicksand"
                    ],
                    "body-lg": [
                            "Quicksand"
                    ],
                    "headline-lg-mobile": [
                            "Quicksand"
                    ],
                    "label-sm": [
                            "Quicksand"
                    ],
                    "body-md": [
                            "Quicksand"
                    ],
                    "label-md": [
                            "Quicksand"
                    ],
                    "headline-xl": [
                            "Quicksand"
                    ]
            },
            "fontSize": {
                    "headline-lg": [
                            "24px",
                            {
                                    "lineHeight": "32px",

                    ],
                    "body-lg": [
                            "18px",

                                    "lineHeight": "26px",

                            }
                    ],
                    "headline-lg-mobile": [
                            "22px",
                            {
                                    "lineHeight": "28px",
                                    "fontWeight": "700"
                            }
                    ],
                    "label-sm": [
                            "12px",
                            {
                                    "lineHeight": "16px",
                                    "letterSpacing": "0.03em",
                                    "fontWeight": "700"
                            }
                    ],
                    "body-md": [
                            "16px",
                            {
                                    "lineHeight": "24px",
                                    "fontWeight": "500"
                            }
                    ],
                    "label-md": [
                            "14px",
                            {
                                    "lineHeight": "20px",
                                    "letterSpacing": "0.01em",
                                    "fontWeight": "600"
                            }
                    ],
                    "headline-xl": [
                            "32px",
                            {
                                    "lineHeight": "40px",
                                    "letterSpacing": "-0.02em",
                                    "fontWeight": "700"
                            }
                    ]
            }
    },
        },
      }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        
        .clay-input {
            background-color: theme('colors.surface-container');
            box-shadow: inset 4px 4px 8px rgba(0, 110, 32, 0.05), inset -4px -4px 8px rgba(255, 255, 255, 0.8);
            transition: all 0.2s ease;
            border: none;
            outline: none;
        }
        
        .clay-input:focus {
            box-shadow: inset 6px 6px 12px rgba(0, 110, 32, 0.1), inset -6px -6px 12px rgba(255, 255, 255, 0.9);
            background-color: theme('colors.surface-container-high');
        }

        .clay-button {
            background-color: theme('colors.primary');
            color: theme('colors.on-primary');
            box-shadow: inset 4px 4px 8px rgba(255, 255, 255, 0.4), inset -4px -4px 8px rgba(0, 50, 10, 0.2), 6px 6px 12px rgba(0, 110, 32, 0.2), -6px -6px 12px rgba(255, 255, 255, 0.8);
            transition: all 0.2s ease;
        }

        .clay-button:active {
            box-shadow: inset 6px 6px 12px rgba(0, 50, 10, 0.3), inset -6px -6px 12px rgba(255, 255, 255, 0.5), 2px 2px 4px rgba(0, 110, 32, 0.1), -2px -2px 4px rgba(255, 255, 255, 0.5);
            transform: scale(0.98);
        }

        .clay-button-secondary {
            background-color: theme('colors.surface-container');
            color: theme('colors.primary');
            box-shadow: inset 2px 2px 4px rgba(255, 255, 255, 0.6), inset -2px -2px 4px rgba(0, 0, 0, 0.05), 8px 8px 16px rgba(0, 0, 0, 0.05), -8px -8px 16px rgba(255, 255, 255, 0.8);
            transition: all 0.2s ease;
        }

        .clay-button-secondary:active {
            box-shadow: inset 4px 4px 8px rgba(0, 0, 0, 0.05), inset -4px -4px 8px rgba(255, 255, 255, 0.6), 2px 2px 4px rgba(0, 0, 0, 0.02), -2px -2px 4px rgba(255, 255, 255, 0.5);
            transform: scale(0.98);
        }

        .clay-card {
            background-color: theme('colors.surface');
            box-shadow: inset 2px 2px 4px rgba(255, 255, 255, 0.6), inset -2px -2px 4px rgba(0, 0, 0, 0.05), 8px 8px 16px rgba(0, 0, 0, 0.05), -8px -8px 16px rgba(255, 255, 255, 0.8);
        }
        
        .clay-add-photo {
            background-color: theme('colors.secondary-container');
            color: theme('colors.on-secondary-container');
            box-shadow: inset 4px 4px 8px rgba(255, 255, 255, 0.6), inset -4px -4px 8px rgba(121, 93, 67, 0.1), 6px 6px 12px rgba(0, 0, 0, 0.05), -6px -6px 12px rgba(255, 255, 255, 0.8);
            transition: all 0.2s ease;
        }
        
        .clay-add-photo:active {
            box-shadow: inset 6px 6px 12px rgba(121, 93, 67, 0.2), inset -6px -6px 12px rgba(255, 255, 255, 0.8), 2px 2px 4px rgba(0, 0, 0, 0.02), -2px -2px 4px rgba(255, 255, 255, 0.5);
            transform: scale(0.98);
        }

        /* Hide scrollbar for clean clay look */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
        
        .clay-nav {
            background-color: theme('colors.surface-container-lowest');
            box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.05), inset 0 2px 4px rgba(255, 255, 255, 0.8);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="antialiased min-h-screen pb-32">
<!-- TopAppBar -->
<header class="w-full top-0 bg-background dark:bg-background shadow-[inset_4px_4px_8px_rgba(255,255,255,0.6),inset_-4px_-4px_8px_rgba(0,110,32,0.2)] sticky z-40">
<div class="flex justify-between items-center px-container-padding py-4 w-full max-w-2xl mx-auto">
<button class="text-on-surface-variant hover:opacity-80 active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-xl text-headline-xl text-primary dark:text-primary-fixed">ClayCook</h1>
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center shadow-[inset_2px_2px_4px_rgba(0,0,0,0.1),inset_-2px_-2px_4px_rgba(255,255,255,0.8)] overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A macro shot of fresh mint leaves on a white ceramic surface, soft daylight, very subtle shadows, clean aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBI0UJs5D59uI4bN0ns83eWmNm5F0sSxX6K6G8SjniChiJLDLh19e3O_TquiWWNpbJZGsKReBl-hVmp8graP55QtgW-9HwStQdL9qIjRO4hPW-HfwYGsNFi48RVA1VfLgvWOBJc8Px6o0wM6ZZUypL8mqZJLtL4vp15RuZir7dCux10Vmx7d0h6pPzVXzYikdoWlF9yl6ejNdVEPzzfe_o4Hr2FyWKIfu7F44rN9gMonG5YkQwlf8Mn"/>
</div>
</div>
</header>
<main class="px-container-padding py-stack-gap max-w-2xl mx-auto flex flex-col gap-8">
<div class="text-center mb-4">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Create Recipe</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Mold your culinary masterpiece.</p>
</div>
<!-- Add Photo Area -->
<button class="clay-add-photo w-full h-48 rounded-lg flex flex-col items-center justify-center gap-3">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
<span class="font-label-md text-label-md">Add Recipe Photo</span>
</button>
<!-- Scan Button Area -->
<button class="clay-button-secondary w-full py-4 rounded-full flex flex-row items-center justify-center gap-2">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">document_scanner</span>
<span class="font-label-md text-label-md">Scan Cookbook Page</span>
</button>
<!-- Recipe Details Form -->
<form class="flex flex-col gap-6">
<!-- Title -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-2" for="recipe-title">Recipe Title</label>
<input class="clay-input w-full p-4 rounded-lg font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant" id="recipe-title" placeholder="e.g., Grandma's Apple Pie" type="text"/>
</div>
<!-- Description -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-2" for="recipe-desc">Description</label>
<textarea class="clay-input w-full p-4 rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline-variant resize-none" id="recipe-desc" placeholder="A brief description of this dish..." rows="3"></textarea>
</div>
<!-- Ingredients Section -->
<div class="clay-card p-4 rounded-lg flex flex-col gap-4">
<div class="flex justify-between items-center">
<h3 class="font-body-lg text-body-lg text-on-surface">Ingredients</h3>
<button class="text-primary hover:opacity-80 active:scale-95 transition-transform flex items-center justify-center w-8 h-8 rounded-full bg-primary-container shadow-[inset_2px_2px_4px_rgba(255,255,255,0.5),inset_-2px_-2px_4px_rgba(0,110,32,0.1)]" type="button">
<span class="material-symbols-outlined text-on-primary-container" style="font-variation-settings: 'FILL' 1;">add</span>
</button>
</div>
<div class="flex flex-col gap-3">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-outline-variant cursor-grab">drag_indicator</span>
<input class="clay-input flex-1 p-3 rounded-DEFAULT font-body-md text-body-md text-on-surface placeholder:text-outline-variant" placeholder="e.g., 2 cups flour" type="text"/>
<button class="text-error opacity-70 hover:opacity-100 p-2" type="button"><span class="material-symbols-outlined">remove_circle</span></button>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-outline-variant cursor-grab">drag_indicator</span>
<input class="clay-input flex-1 p-3 rounded-DEFAULT font-body-md text-body-md text-on-surface placeholder:text-outline-variant" placeholder="e.g., 1 tsp salt" type="text"/>
<button class="text-error opacity-70 hover:opacity-100 p-2" type="button"><span class="material-symbols-outlined">remove_circle</span></button>
</div>
</div>
</div>
<!-- Steps Section -->
<div class="clay-card p-4 rounded-lg flex flex-col gap-4">
<div class="flex justify-between items-center">
<h3 class="font-body-lg text-body-lg text-on-surface">Instructions</h3>
<button class="text-primary hover:opacity-80 active:scale-95 transition-transform flex items-center justify-center w-8 h-8 rounded-full bg-primary-container shadow-[inset_2px_2px_4px_rgba(255,255,255,0.5),inset_-2px_-2px_4px_rgba(0,110,32,0.1)]" type="button">
<span class="material-symbols-outlined text-on-primary-container" style="font-variation-settings: 'FILL' 1;">add</span>
</button>
</div>
<div class="flex flex-col gap-4">
<div class="flex gap-3 items-start">
<div class="w-8 h-8 shrink-0 rounded-full bg-surface-container flex items-center justify-center font-label-md text-label-md text-on-surface-variant shadow-[inset_2px_2px_4px_rgba(255,255,255,0.8),inset_-2px_-2px_4px_rgba(0,0,0,0.1)] mt-1">1</div>
<textarea class="clay-input flex-1 p-3 rounded-DEFAULT font-body-md text-body-md text-on-surface placeholder:text-outline-variant resize-none" placeholder="Describe this step..." rows="2"></textarea>
</div>
<div class="flex gap-3 items-start">
<div class="w-8 h-8 shrink-0 rounded-full bg-surface-container flex items-center justify-center font-label-md text-label-md text-on-surface-variant shadow-[inset_2px_2px_4px_rgba(255,255,255,0.8),inset_-2px_-2px_4px_rgba(0,0,0,0.1)] mt-1">2</div>
<textarea class="clay-input flex-1 p-3 rounded-DEFAULT font-body-md text-body-md text-on-surface placeholder:text-outline-variant resize-none" placeholder="Describe this step..." rows="2"></textarea>
</div>
</div>
</div>
<!-- Details (Time, Servings) -->
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-2 flex items-center gap-1" for="prep-time"><span class="material-symbols-outlined text-[16px]">schedule</span> Prep Time</label>
<input class="clay-input w-full p-3 rounded-DEFAULT font-body-md text-body-md text-on-surface text-center" id="prep-time" placeholder="30 mins" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-2 flex items-center gap-1" for="servings"><span class="material-symbols-outlined text-[16px]">restaurant</span> Servings</label>
<input class="clay-input w-full p-3 rounded-DEFAULT font-body-md text-body-md text-on-surface text-center" id="servings" placeholder="4" type="number"/>
</div>
</div>
</form>
</main>
<!-- Floating Action Button (Save) -->
<div class="fixed bottom-24 left-1/2 -translate-x-1/2 w-[90%] max-w-md z-40">
<button class="clay-button w-full py-4 rounded-full flex items-center justify-center gap-2 font-body-lg text-body-lg">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">save</span>
            Save Recipe
        </button>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full clay-nav z-50 rounded-t-[2rem]">
<div class="flex justify-around items-center px-4 py-3 max-w-md mx-auto">
<button class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary transition-colors min-w-[64px]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">book</span>
<span class="font-label-sm text-label-sm">Library</span>
</button>
<button class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary transition-colors min-w-[64px]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">calendar_today</span>
<span class="font-label-sm text-label-sm">Planner</span>
</button>
<button class="flex flex-col items-center gap-1 text-primary min-w-[64px]">
<div class="bg-primary-container px-4 py-1 rounded-full shadow-[inset_2px_2px_4px_rgba(255,255,255,0.5),inset_-2px_-2px_4px_rgba(0,110,32,0.1)]">
<span class="material-symbols-outlined text-on-primary-container" style="font-variation-settings: 'FILL' 1;">add_circle</span>
</div>
<span class="font-label-sm text-label-sm font-bold">Import</span>
</button>
<button class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary transition-colors min-w-[64px]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</button>
</div>
</nav>
</body></html>
