<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            font-family: 'Quicksand', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Claymorphism Utilities */
        .clay-card {
            background-color: theme('colors.surface');
            box-shadow: 
                8px 8px 16px rgba(0, 0, 0, 0.05),
                -8px -8px 16px rgba(255, 255, 255, 0.8),
                inset 2px 2px 4px rgba(255, 255, 255, 0.5),
                inset -2px -2px 4px rgba(0, 0, 0, 0.02);
            border-radius: theme('borderRadius.lg');
            transition: all 0.2s ease;
        }
        
        .clay-card-interactive:active {
             box-shadow: 
                2px 2px 4px rgba(0, 0, 0, 0.05),
                -2px -2px 4px rgba(255, 255, 255, 0.8),
                inset 4px 4px 8px rgba(0, 0, 0, 0.05),
                inset -4px -4px 8px rgba(255, 255, 255, 0.5);
             transform: scale(0.98);
        }

        .clay-inset {
            background-color: theme('colors.surface-container-low');
            box-shadow: 
                inset 4px 4px 8px rgba(0, 0, 0, 0.05),
                inset -4px -4px 8px rgba(255, 255, 255, 0.8);
            border-radius: theme('borderRadius.DEFAULT');
        }

        .clay-button-primary {
            background-color: theme('colors.primary-container');
            color: theme('colors.on-primary-container');
            box-shadow: 
                6px 6px 12px rgba(0, 110, 32, 0.15),
                -6px -6px 12px rgba(255, 255, 255, 0.9),
                inset 2px 2px 4px rgba(255, 255, 255, 0.6),
                inset -2px -2px 4px rgba(0, 110, 32, 0.1);
            border-radius: theme('borderRadius.full');
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .clay-button-primary:active {
            box-shadow: 
                inset 6px 6px 12px rgba(0, 110, 32, 0.2),
                inset -6px -6px 12px rgba(255, 255, 255, 0.8);
            transform: scale(0.95);
        }

        /* Checkbox Styling */
        .clay-checkbox {
            appearance: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-color: theme('colors.surface');
            box-shadow: 
                inset 3px 3px 6px rgba(0, 0, 0, 0.08),
                inset -3px -3px 6px rgba(255, 255, 255, 0.9);
            position: relative;
            cursor: pointer;
            outline: none;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .clay-checkbox:checked {
            background-color: theme('colors.primary-container');
             box-shadow: 
                inset 3px 3px 6px rgba(0, 110, 32, 0.2),
                inset -3px -3px 6px rgba(255, 255, 255, 0.6);
        }

        .clay-checkbox::after {
            content: '';
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(45deg) scale(0);
            width: 8px;
            height: 14px;
            border-right: 3px solid theme('colors.on-primary-container');
            border-bottom: 3px solid theme('colors.on-primary-container');
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .clay-checkbox:checked::after {
            transform: translate(-50%, -50%) rotate(45deg) scale(1);
        }
        
        .checked-item-text {
            color: theme('colors.outline');
            text-decoration: line-through;
            opacity: 0.6;
        }
    </style>
</head>

<script>
        // Toggle Switch Logic
        function switchTab(btn, tabName) {
            const bg = document.getElementById('toggle-bg');
            const btns = btn.parentElement.querySelectorAll('button');
            
            // Update Text Colors
            btns.forEach(b => {
                b.classList.remove('text-primary', 'font-bold');
                b.classList.add('text-on-surface-variant');
                b.setAttribute('aria-selected', 'false');
            });
            btn.classList.add('text-primary', 'font-bold');
            btn.classList.remove('text-on-surface-variant');
            btn.setAttribute('aria-selected', 'true');

            // Move Background
            if(tabName === 'category') {
                bg.style.transform = 'translateX(100%)';
            } else {
                bg.style.transform = 'translateX(0)';
            }
        }

        // Checkbox interaction logic for text styling
        document.querySelectorAll('.clay-checkbox').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const labelText = this.nextElementSibling.querySelector('.item-name');
                const card = this.closest('.clay-card');
                
                if(this.checked) {
                    labelText.classList.add('checked-item-text');
                    card.classList.add('opacity-70');
                } else {
                    labelText.classList.remove('checked-item-text');
                    card.classList.remove('opacity-70');
                }
            });
        });
    </script>
