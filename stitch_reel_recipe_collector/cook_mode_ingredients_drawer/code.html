<style type="text/tailwindcss">
        @layer utilities {
            .clay-shadow {
                box-shadow: inset 4px 4px 8px rgba(255, 255, 255, 0.8), inset -4px -4px 8px rgba(0, 0, 0, 0.05), 0 4px 10px rgba(0, 0, 0, 0.05);
            }
            .clay-inset {
                box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.1), inset -2px -2px 5px rgba(255, 255, 255, 0.7);
            }
            .clay-btn {
                box-shadow: inset 2px 2px 4px rgba(255,255,255,0.4), inset -2px -2px 4px rgba(0,0,0,0.1), 0 2px 5px rgba(0,0,0,0.05);
            }
            .clay-btn:active {
                box-shadow: inset 4px 4px 8px rgba(0,0,0,0.1), inset -4px -4px 8px rgba(255,255,255,0.4);
            }

<body class="bg-background min-h-screen text-on-surface font-body-md overflow-hidden relative">
<!-- Screen Content Placeholder (Blurring background) -->
<div class="fixed inset-0 bg-surface-variant/50 backdrop-blur-sm z-40" id="scrim"></div>
<!-- Main App Content (Simulated for context) -->
<main class="relative z-10 w-full h-full p-container-padding flex flex-col pointer-events-none opacity-50">
<header class="w-full flex items-center justify-between mb-stack-gap">
<h1 class="font-headline-xl text-headline-xl text-primary tracking-tight">ClayCook</h1>
</header>
<div class="flex-1 bg-surface-container rounded-lg clay-shadow flex items-center justify-center">
<span class="material-symbols-outlined text-4xl text-on-surface-variant">restaurant_menu</span>
</div>
</main>
<!-- Ingredients Drawer (Bottom Sheet on Mobile, Side Drawer on Web) -->
<aside class="fixed bottom-0 left-0 right-0 md:inset-y-0 md:left-0 md:right-auto z-50 flex flex-col bg-surface-bright shadow-[0_-10px_30px_rgba(0,0,0,0.1)] md:shadow-[10px_0_30px_rgba(0,0,0,0.1)] rounded-t-xl md:rounded-r-xl md:rounded-t-none h-[80vh] md:h-full w-full md:w-96 transition-transform duration-300 ease-in-out transform translate-y-0 md:translate-x-0 shadow-[inset_6px_6px_12px_rgba(255,255,255,0.5),inset_-6px_-6px_12px_rgba(0,0,0,0.05)]" id="ingredients-drawer">
<!-- Drag Handle (Mobile Only) -->
<div class="w-full flex justify-center pt-4 pb-2 md:hidden">
<div class="w-12 h-1.5 bg-outline-variant rounded-full clay-inset"></div>
</div>
<!-- Header -->
<div class="flex items-center justify-between px-container-padding py-4 border-b border-surface-variant/30">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary flex items-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">restaurant</span>
                Ingredients
            </h2>
<button class="w-touch-target h-touch-target flex items-center justify-center rounded-full bg-surface-container-low text-on-surface-variant clay-btn hover:opacity-80 transition-all active:scale-95" id="close-drawer">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Checklist Content -->
<div class="flex-1 overflow-y-auto px-container-padding py-stack-gap space-y-3">
<!-- Checklist Item 1 -->
<label class="flex items-center p-3 rounded-lg bg-surface-container-lowest clay-shadow cursor-pointer hover:bg-surface-variant/20 transition-colors group">
<div class="relative flex items-center justify-center w-6 h-6 mr-4 rounded-md bg-surface-container clay-inset overflow-hidden flex-shrink-0">
<input class="peer sr-only" type="checkbox"/>
<span class="material-symbols-outlined text-primary opacity-0 peer-checked:opacity-100 transition-opacity duration-200 transform scale-50 peer-checked:scale-100" style="font-variation-settings: 'FILL' 1; font-size: 20px;">check</span>
</div>
<div class="flex-1">
<p class="font-body-md text-on-surface group-[&amp;:has(input:checked)]:text-on-surface-variant group-[&amp;:has(input:checked)]:line-through transition-all">2 cups all-purpose flour</p>
</div>
</label>
<!-- Checklist Item 2 -->
<label class="flex items-center p-3 rounded-lg bg-surface-container-lowest clay-shadow cursor-pointer hover:bg-surface-variant/20 transition-colors group">
<div class="relative flex items-center justify-center w-6 h-6 mr-4 rounded-md bg-surface-container clay-inset overflow-hidden flex-shrink-0">
<input checked="" class="peer sr-only" type="checkbox"/>
<span class="material-symbols-outlined text-primary opacity-0 peer-checked:opacity-100 transition-opacity duration-200 transform scale-50 peer-checked:scale-100" style="font-variation-settings: 'FILL' 1; font-size: 20px;">check</span>
</div>
<div class="flex-1">
<p class="font-body-md text-on-surface group-[&amp;:has(input:checked)]:text-on-surface-variant group-[&amp;:has(input:checked)]:line-through transition-all">1 cup granulated sugar</p>
</div>
</label>
<!-- Checklist Item 3 -->
<label class="flex items-center p-3 rounded-lg bg-surface-container-lowest clay-shadow cursor-pointer hover:bg-surface-variant/20 transition-colors group">
<div class="relative flex items-center justify-center w-6 h-6 mr-4 rounded-md bg-surface-container clay-inset overflow-hidden flex-shrink-0">
<input class="peer sr-only" type="checkbox"/>
<span class="material-symbols-outlined text-primary opacity-0 peer-checked:opacity-100 transition-opacity duration-200 transform scale-50 peer-checked:scale-100" style="font-variation-settings: 'FILL' 1; font-size: 20px;">check</span>
</div>
<div class="flex-1">
<p class="font-body-md text-on-surface group-[&amp;:has(input:checked)]:text-on-surface-variant group-[&amp;:has(input:checked)]:line-through transition-all">1/2 cup unsalted butter, softened</p>
</div>
</label>
<!-- Checklist Item 4 -->
<label class="flex items-center p-3 rounded-lg bg-surface-container-lowest clay-shadow cursor-pointer hover:bg-surface-variant/20 transition-colors group">
<div class="relative flex items-center justify-center w-6 h-6 mr-4 rounded-md bg-surface-container clay-inset overflow-hidden flex-shrink-0">
<input class="peer sr-only" type="checkbox"/>
<span class="material-symbols-outlined text-primary opacity-0 peer-checked:opacity-100 transition-opacity duration-200 transform scale-50 peer-checked:scale-100" style="font-variation-settings: 'FILL' 1; font-size: 20px;">check</span>
</div>
<div class="flex-1 flex justify-between items-center">
<p class="font-body-md text-on-surface group-[&amp;:has(input:checked)]:text-on-surface-variant group-[&amp;:has(input:checked)]:line-through transition-all">3 large eggs</p>
<span class="px-2 py-1 bg-secondary-container text-on-secondary-container rounded-full font-label-sm text-label-sm shadow-[inset_1px_1px_2px_rgba(255,255,255,0.4),inset_-1px_-1px_2px_rgba(0,0,0,0.1)]">Room Temp</span>
</div>
</label>
<!-- Checklist Item 5 -->
<label class="flex items-center p-3 rounded-lg bg-surface-container-lowest clay-shadow cursor-pointer hover:bg-surface-variant/20 transition-colors group">
<div class="relative flex items-center justify-center w-6 h-6 mr-4 rounded-md bg-surface-container clay-inset overflow-hidden flex-shrink-0">
<input class="peer sr-only" type="checkbox"/>
<span class="material-symbols-outlined text-primary opacity-0 peer-checked:opacity-100 transition-opacity duration-200 transform scale-50 peer-checked:scale-100" style="font-variation-settings: 'FILL' 1; font-size: 20px;">check</span>
</div>
<div class="flex-1">
<p class="font-body-md text-on-surface group-[&amp;:has(input:checked)]:text-on-surface-variant group-[&amp;:has(input:checked)]:line-through transition-all">1 tsp vanilla extract</p>
</div>
</label>
</div>
<!-- Footer Action -->
<div class="p-container-padding bg-surface-bright">
<button class="w-full py-4 bg-primary text-on-primary rounded-full font-label-md text-label-md shadow-[inset_2px_2px_6px_rgba(255,255,255,0.3),inset_-2px_-2px_6px_rgba(0,0,0,0.2),0_4px_10px_rgba(0,110,32,0.2)] active:scale-95 transition-transform duration-200 flex justify-center items-center gap-2">
<span class="material-symbols-outlined" style="font-size: 20px;">add_shopping_cart</span>
                Add Missing to Cart
            </button>
</div>
</aside>
<!-- Drawer Interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const drawer = document.getElementById('ingredients-drawer');
            const closeBtn = document.getElementById('close-drawer');
            const scrim = document.getElementById('scrim');

            const closeDrawer = () => {
                if(window.innerWidth < 768) {
                    drawer.style.transform = 'translateY(100%)';
                } else {
                    drawer.style.transform = 'translateX(-100%)';
                }
                scrim.style.opacity = '0';
                setTimeout(() => {
                    scrim.style.display = 'none';
                }, 300);
            };

            closeBtn.addEventListener('click', closeDrawer);
            scrim.addEventListener('click', closeDrawer);
        });
    </script>
</body></html>
