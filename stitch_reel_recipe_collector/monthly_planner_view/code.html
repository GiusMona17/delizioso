<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ClayCook - Monthly Meal Planner</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-primary-container": "#007924",
                      "on-error": "#ffffff",
                      "tertiary-fixed": "#e6e5b9",
                      "secondary-container": "#fed9b8",
                      "on-tertiary-fixed-variant": "#484828",
                      "on-tertiary-fixed": "#1d1d03",
                      "tertiary-fixed-dim": "#cac99f",
                      "error-container": "#ffdad6",
                      "on-tertiary-container": "#6a6946",
                      "surface-container-lowest": "#ffffff",
                      "on-primary-fixed-variant": "#005316",
                      "secondary-fixed": "#ffdcbe",
                      "primary-fixed-dim": "#77dc7a",
                      "inverse-primary": "#77dc7a",
                      "background": "#fbf9f8",
                      "primary": "#006e20",
                      "on-secondary-fixed-variant": "#5a422a",
                      "on-primary": "#ffffff",
                      "on-surface": "#1b1c1c",
                      "primary-container": "#98ff98",
                      "surface-container-highest": "#e4e2e2",
                      "primary-fixed": "#93f993",
                      "tertiary-container": "#eceabe",
                      "on-tertiary": "#ffffff",
                      "surface": "#fbf9f8",
                      "surface-bright": "#fbf9f8",
                      "secondary-fixed-dim": "#e3c0a0",
                      "on-surface-variant": "#3f4a3d",
                      "outline-variant": "#becab9",
                      "on-error-container": "#93000a",
                      "on-secondary": "#ffffff",
                      "secondary": "#74593f",
                      "inverse-on-surface": "#f2f0f0",
                      "surface-container-low": "#f5f3f3",
                      "on-secondary-fixed": "#2a1704",
                      "on-background": "#1b1c1c",
                      "surface-variant": "#e4e2e2",
                      "surface-tint": "#006e20",
                      "tertiary": "#60603e",
                      "surface-dim": "#dbd9d9",
                      "surface-container": "#efeded",
                      "inverse-surface": "#303030",
                      "surface-container-high": "#eae8e7",
                      "on-primary-fixed": "#002105",
                      "on-secondary-container": "#795d43",
                      "error": "#ba1a1a",
                      "outline": "#6f7a6c"
              },
              "borderRadius": {
                      "DEFAULT": "1rem",
                      "lg": "2rem",
                      "xl": "3rem",
                      "full": "9999px"
              },
              "spacing": {
                      "base": "8px",
                      "touch-target": "48px",
                      "stack-gap": "16px",
                      "container-padding": "20px",
                      "card-gutter": "12px"
              },
              "fontFamily": {
                      "body-lg": ["Quicksand"],
                      "headline-lg-mobile": ["Quicksand"],
                      "label-md": ["Quicksand"],
                      "body-md": ["Quicksand"],
                      "headline-xl": ["Quicksand"],
                      "headline-lg": ["Quicksand"],
                      "label-sm": ["Quicksand"]
              },
              "fontSize": {
                      "body-lg": ["18px", {"lineHeight": "26px", "fontWeight": "500"}],
                      "headline-lg-mobile": ["22px", {"lineHeight": "28px", "fontWeight": "700"}],
                      "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "500"}],
                      "headline-xl": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "headline-lg": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                      "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.03em", "fontWeight": "700"}]
              }
            }
          }
        }
    </script>
<style type="text/tailwindcss">
        @layer utilities {
            .clay-outer {
                @apply shadow-[-8px_-8px_16px_rgba(255,255,255,0.8),8px_8px_16px_rgba(0,0,0,0.1)];
            }
            .clay-inner {
                @apply shadow-[inset_4px_4px_8px_rgba(0,0,0,0.1),inset_-4px_-4px_8px_rgba(255,255,255,0.8)];
            }
            .clay-btn {
                @apply shadow-[-4px_-4px_8px_rgba(255,255,255,0.8),4px_4px_8px_rgba(0,0,0,0.1)] active:shadow-[inset_4px_4px_8px_rgba(0,0,0,0.1),inset_-4px_-4px_8px_rgba(255,255,255,0.8)] active:translate-y-0.5 transition-all duration-200;
            }
            .clay-text-inset {
                text-shadow: 1px 1px 2px rgba(255,255,255,0.8), -1px -1px 2px rgba(0,0,0,0.1);
            }
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen pb-32 overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-40 bg-background dark:bg-background shadow-[inset_4px_4px_8px_rgba(255,255,255,0.6),inset_-4px_-4px_8px_rgba(0,110,32,0.2)]">
<div class="flex justify-between items-center px-container-padding py-4 w-full">
<button class="h-touch-target w-touch-target flex items-center justify-center rounded-full clay-btn text-primary hover:opacity-80 active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline-xl text-headline-xl text-primary dark:text-primary-fixed">ClayCook</h1>
<div class="h-touch-target w-touch-target rounded-full clay-btn overflow-hidden border-2 border-surface flex items-center justify-center bg-surface-container">
<span class="material-symbols-outlined text-primary" data-icon="person">person</span>
</div>
</div>
</header>
<main class="px-container-padding py-stack-gap max-w-4xl mx-auto flex flex-col gap-8">
<!-- Header & Controls -->
<section class="flex flex-col md:flex-row justify-between items-center gap-4 bg-surface-container rounded-3xl p-6 clay-outer">
<div class="flex items-center gap-4">
<button class="w-10 h-10 rounded-full clay-btn flex items-center justify-center bg-surface text-primary">
<span class="material-symbols-outlined">chevron_left</span>
</button>
<h2 class="font-headline-lg-mobile md:font-headline-lg text-primary text-center min-w-[150px]">October 2023</h2>
<button class="w-10 h-10 rounded-full clay-btn flex items-center justify-center bg-surface text-primary">
<span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
<button class="bg-primary-container text-on-primary-container font-label-md px-6 py-3 rounded-full clay-btn flex items-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">calendar_view_week</span>
                Switch to Weekly
            </button>
</section>
<!-- Calendar Grid -->
<section class="bg-surface-container rounded-3xl p-4 md:p-8 clay-outer">
<!-- Days of Week Header -->
<div class="grid grid-cols-7 gap-2 mb-4 text-center">
<div class="font-label-md text-on-surface-variant">S</div>
<div class="font-label-md text-on-surface-variant">M</div>
<div class="font-label-md text-on-surface-variant">T</div>
<div class="font-label-md text-on-surface-variant">W</div>
<div class="font-label-md text-on-surface-variant">T</div>
<div class="font-label-md text-on-surface-variant">F</div>
<div class="font-label-md text-on-surface-variant">S</div>
</div>
<!-- Calendar Days -->
<div class="grid grid-cols-7 gap-2 md:gap-4">
<!-- Empty slots for prev month -->
<div class="aspect-square rounded-xl bg-transparent flex items-center justify-center p-1 md:p-2"></div>
<div class="aspect-square rounded-xl bg-transparent flex items-center justify-center p-1 md:p-2"></div>
<!-- Day 1 -->
<div class="aspect-square rounded-xl bg-background clay-inner flex flex-col items-center justify-start pt-2 md:pt-3 pb-1 md:pb-2 relative cursor-pointer hover:bg-surface-variant transition-colors group">
<span class="font-body-md text-on-surface">1</span>
</div>
<!-- Day 2 (Planned) -->
<div class="aspect-square rounded-xl bg-background clay-inner flex flex-col items-center justify-start pt-2 md:pt-3 pb-1 md:pb-2 relative cursor-pointer hover:bg-surface-variant transition-colors group border-2 border-transparent hover:border-primary-container">
<span class="font-body-md text-on-surface">2</span>
<div class="absolute bottom-2 md:bottom-3 flex gap-1">
<span class="w-2 h-2 rounded-full bg-primary shadow-sm"></span>
<span class="w-2 h-2 rounded-full bg-secondary shadow-sm"></span>
</div>
</div>
<!-- Day 3 -->
<div class="aspect-square rounded-xl bg-background clay-inner flex flex-col items-center justify-start pt-2 md:pt-3 pb-1 md:pb-2 relative cursor-pointer hover:bg-surface-variant transition-colors group">
<span class="font-body-md text-on-surface">3</span>
</div>
<!-- Day 4 (Today) -->
<div class="aspect-square rounded-xl bg-primary-container clay-inner flex flex-col items-center justify-start pt-2 md:pt-3 pb-1 md:pb-2 relative cursor-pointer hover:opacity-90 transition-opacity group">
<span class="font-label-md text-on-primary-container">4</span>
<div class="absolute bottom-2 md:bottom-3 flex gap-1">
<span class="w-2 h-2 rounded-full bg-primary shadow-sm"></span>
</div>
</div>
<!-- Day 5 -->
<div class="aspect-square rounded-xl bg-background clay-inner flex flex-col items-center justify-start pt-2 md:pt-3 pb-1 md:pb-2 relative cursor-pointer hover:bg-surface-variant transition-colors group">
<span class="font-body-md text-on-surface">5</span>
</div>
<!-- Day 6 -->
<div class="aspect-square rounded-xl bg-background clay-inner flex flex-col items-center justify-start pt-2 md:pt-3 pb-1 md:pb-2 relative cursor-pointer hover:bg-surface-variant transition-colors group">
<span class="font-body-md text-on-surface">6</span>
</div>
<!-- Day 7 -->
<div class="aspect-square rounded-xl bg-background clay-inner flex flex-col items-center justify-start pt-2 md:pt-3 pb-1 md:pb-2 relative cursor-pointer hover:bg-surface-variant transition-colors group">
<span class="font-body-md text-on-surface">7</span>
<div class="absolute bottom-2 md:bottom-3 flex gap-1">
<span class="w-2 h-2 rounded-full bg-primary shadow-sm"></span>
</div>
</div>
<!-- Day 8 -->
<div class="aspect-square rounded-xl bg-background clay-inner flex flex-col items-center justify-start pt-2 md:pt-3 pb-1 md:pb-2 relative cursor-pointer hover:bg-surface-variant transition-colors group">
<span class="font-body-md text-on-surface">8</span>
</div>
<!-- Continue for a few more to show pattern... -->
<div class="aspect-square rounded-xl bg-background clay-inner flex flex-col items-center justify-start pt-2 md:pt-3 pb-1 md:pb-2 relative cursor-pointer hover:bg-surface-variant transition-colors">
<span class="font-body-md text-on-surface">9</span>
</div>
<div class="aspect-square rounded-xl bg-background clay-inner flex flex-col items-center justify-start pt-2 md:pt-3 pb-1 md:pb-2 relative cursor-pointer hover:bg-surface-variant transition-colors">
<span class="font-body-md text-on-surface">10</span>
</div>
<div class="aspect-square rounded-xl bg-background clay-inner flex flex-col items-center justify-start pt-2 md:pt-3 pb-1 md:pb-2 relative cursor-pointer hover:bg-surface-variant transition-colors">
<span class="font-body-md text-on-surface">11</span>
<div class="absolute bottom-2 md:bottom-3 flex gap-1">
<span class="w-2 h-2 rounded-full bg-secondary shadow-sm"></span>
</div>
</div>
<div class="aspect-square rounded-xl bg-background clay-inner flex flex-col items-center justify-start pt-2 md:pt-3 pb-1 md:pb-2 relative cursor-pointer hover:bg-surface-variant transition-colors">
<span class="font-body-md text-on-surface">12</span>
</div>
<div class="aspect-square rounded-xl bg-background clay-inner flex flex-col items-center justify-start pt-2 md:pt-3 pb-1 md:pb-2 relative cursor-pointer hover:bg-surface-variant transition-colors">
<span class="font-body-md text-on-surface">13</span>
</div>
<div class="aspect-square rounded-xl bg-background clay-inner flex flex-col items-center justify-start pt-2 md:pt-3 pb-1 md:pb-2 relative cursor-pointer hover:bg-surface-variant transition-colors">
<span class="font-body-md text-on-surface">14</span>
<div class="absolute bottom-2 md:bottom-3 flex gap-1">
<span class="w-2 h-2 rounded-full bg-primary shadow-sm"></span>
<span class="w-2 h-2 rounded-full bg-primary shadow-sm"></span>
<span class="w-2 h-2 rounded-full bg-primary shadow-sm"></span>
</div>
</div>
</div>
<!-- Legend -->
<div class="mt-8 flex justify-center gap-6">
<div class="flex items-center gap-2">
<span class="w-3 h-3 rounded-full bg-primary shadow-sm"></span>
<span class="font-label-md text-on-surface-variant">Planned</span>
</div>
<div class="flex items-center gap-2">
<span class="w-3 h-3 rounded-full bg-secondary shadow-sm"></span>
<span class="font-label-md text-on-surface-variant">Cooked</span>
</div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="md:hidden fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-md z-50 flex justify-around items-center p-2 bg-surface-container dark:bg-surface-container-highest rounded-full shadow-[8px_8px_16px_rgba(0,0,0,0.1),-8px_-8px_16px_rgba(255,255,255,0.8)] shadow-[inset_2px_2px_4px_rgba(255,255,255,0.4),inset_-2px_-2px_4px_rgba(0,0,0,0.1)]">
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-variant/50 active:scale-90 transition-all duration-300 ease-out rounded-2xl w-16">
<span class="material-symbols-outlined mb-1" data-icon="style">style</span>
<span class="font-label-sm text-label-sm">Library</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-variant/50 active:scale-90 transition-all duration-300 ease-out rounded-2xl w-16">
<span class="material-symbols-outlined mb-1" data-icon="download">download</span>
<span class="font-label-sm text-label-sm">Import</span>
</button>
<!-- Active Tab: Create (Meal Planner context) -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-2 shadow-[inset_3px_3px_6px_rgba(255,255,255,0.5),inset_-3px_-3px_6px_rgba(0,110,32,0.2)] active:scale-90 transition-all duration-300 ease-out w-20">
<span class="material-symbols-outlined mb-1" data-icon="add_circle" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-label-sm text-label-sm">Create</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-variant/50 active:scale-90 transition-all duration-300 ease-out rounded-2xl w-16">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</button>
</nav>
</body></html>
